[project]
name = "routine-psv"
version = "0.1.0"
description = "Prepare and transfer Adrenaline/PS1 files to a PS Vita over FTP"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "pycryptodome>=3.20",
  "requests>=2.31",
  "PySocks>=1.7.1",
]

[project.scripts]
psv = "psv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["psv.py"]
