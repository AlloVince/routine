[project]
name = "appshots"
version = "0.1.0"
description = "Extract conservative UI-state screenshots from iPhone app walkthroughs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0", "imagehash>=4.3", "reportlab>=4.0"]

[project.scripts]
appshots = "appshots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
